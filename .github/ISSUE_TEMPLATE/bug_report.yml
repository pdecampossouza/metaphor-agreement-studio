name: Bug report
description: Report a reproducible software problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not attach confidential research workbooks. Use a synthetic or redistributable example instead."
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproducible sequence of actions.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Technical details
      description: Request ID, traceback, or additional context when available.
