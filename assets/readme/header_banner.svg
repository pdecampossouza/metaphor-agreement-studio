<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Metaphor Agreement Studio banner</title>
  <desc id="desc">Scientific banner with music, books, video, data, and metaphor-analysis motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2a6f97"/>
      <stop offset="100%" stop-color="#6a4c93"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a9b8d0" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect x="32" y="32" width="1136" height="256" rx="22" fill="#ffffff" stroke="#dce5f3"/>

  <g opacity="0.9">
    <circle cx="112" cy="98" r="42" fill="#eff5ff" stroke="#d7e4fb"/>
    <circle cx="247" cy="98" r="42" fill="#f3efff" stroke="#e0d9fb"/>
    <circle cx="382" cy="98" r="42" fill="#effaf6" stroke="#d8efe7"/>
    <circle cx="517" cy="98" r="42" fill="#fff4eb" stroke="#f6ddc9"/>
    <circle cx="652" cy="98" r="42" fill="#f6f3ff" stroke="#e7defa"/>

    <!-- music -->
    <g transform="translate(88,72)" stroke="#2a6f97" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 8v44"/>
      <path d="M22 8l28-8v42"/>
      <circle cx="12" cy="56" r="10" fill="#2a6f97" opacity="0.9"/>
      <circle cx="40" cy="52" r="10" fill="#2a6f97" opacity="0.9"/>
    </g>

    <!-- books -->
    <g transform="translate(220,72)">
      <rect x="0" y="6" width="20" height="48" rx="4" fill="#6a4c93"/>
      <rect x="22" y="0" width="20" height="54" rx="4" fill="#8864b0"/>
      <rect x="44" y="10" width="20" height="44" rx="4" fill="#a57bc8"/>
      <line x1="10" y1="14" x2="10" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <line x1="32" y1="10" x2="32" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <line x1="54" y1="18" x2="54" y2="44" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- video -->
    <g transform="translate(355,74)">
      <rect x="0" y="0" width="60" height="42" rx="10" fill="#2d6a4f" opacity="0.92"/>
      <polygon points="23,12 23,30 40,21" fill="#ffffff"/>
      <rect x="10" y="48" width="40" height="4" rx="2" fill="#9cc3b3"/>
    </g>

    <!-- spreadsheet/data -->
    <g transform="translate(492,70)">
      <rect x="0" y="0" width="52" height="52" rx="10" fill="#cc7722" opacity="0.92"/>
      <g stroke="#ffffff" stroke-width="2">
        <line x1="17" y1="8" x2="17" y2="44"/>
        <line x1="34" y1="8" x2="34" y2="44"/>
        <line x1="8" y1="20" x2="44" y2="20"/>
        <line x1="8" y1="32" x2="44" y2="32"/>
      </g>
    </g>

    <!-- chart/statistics -->
    <g transform="translate(624,72)">
      <rect x="0" y="0" width="56" height="48" rx="10" fill="#5b8c5a" opacity="0.18" stroke="#5b8c5a"/>
      <polyline points="8,36 20,24 31,29 45,14" fill="none" stroke="#5b8c5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="36" r="3.5" fill="#5b8c5a"/>
      <circle cx="20" cy="24" r="3.5" fill="#5b8c5a"/>
      <circle cx="31" cy="29" r="3.5" fill="#5b8c5a"/>
      <circle cx="45" cy="14" r="3.5" fill="#5b8c5a"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="732" y="62" width="392" height="164" rx="20" fill="#fbfcfe" stroke="#dde6f2"/>
    <text x="766" y="108" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#17324d">Metaphor Agreement Studio</text>
    <text x="766" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#35506d">Research software for reproducible metaphor-annotation analysis</text>

    <line x1="766" y1="160" x2="1078" y2="160" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

    <text x="766" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3d4b5c">Music • Video • Text • Annotation Data • Statistics</text>
    <text x="766" y="214" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#627489">Human validation, agreement metrics, figures, and reports</text>
  </g>

  <g opacity="0.45">
    <path d="M56 242 C146 202, 214 202, 306 242 S470 282, 560 242" fill="none" stroke="#bdd0e9" stroke-width="4"/>
    <path d="M122 246 C212 206, 280 206, 372 246 S536 286, 626 246" fill="none" stroke="#d8c9ef" stroke-width="4"/>
  </g>
</svg>
